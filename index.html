<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SAKURIN SHOP｜會員中心</title>
<style>
:root{font-family:system-ui,'Noto Sans TC',sans-serif;color:#493e45;background:#fff8fa}*{box-sizing:border-box}body{margin:0;padding:28px 16px}.wrap{max-width:520px;margin:35px auto;background:white;border:1px solid #f0dce4;border-radius:22px;padding:30px;box-shadow:0 14px 40px #e6b9cb22}h1{font-size:27px;text-align:center;margin:0;color:#b66c8a}.sub{text-align:center;color:#9c8790;font-size:13px;margin:8px 0 25px}.tabs{display:flex;gap:8px;margin-bottom:18px}.tabs button{flex:1;background:#fff0f5;color:#985c74}.tabs button.active,button.primary{background:#c87999;color:white}label{display:block;font-size:13px;margin:14px 0 6px}input,select{width:100%;padding:12px;border:1px solid #e6ccd6;border-radius:10px;background:#fff;font:inherit}button{border:0;border-radius:10px;padding:12px 15px;font:inherit;cursor:pointer}button.primary{width:100%;margin-top:18px}button:disabled{opacity:.55;cursor:wait}.hidden{display:none}.note{font-size:12px;color:#8d7a82;line-height:1.7}.message{white-space:pre-wrap;font-size:13px;margin-top:15px;line-height:1.6}.error{color:#b12e53}.success{color:#347957}.actions{display:flex;gap:8px;margin-top:12px}.actions button{flex:1;background:#fff0f5;color:#985c74}
</style>
</head><body><main class="wrap"><h1>SAKURIN SHOP 🌸</h1><p class="sub">會員中心</p>

<section id="auth" class="hidden"><div class="tabs"><button id="loginTab" class="active">登入</button><button id="registerTab">註冊</button></div><form id="authForm"><label>電子郵件</label><input id="email" type="email" required autocomplete="email"><label>密碼</label><input id="password" type="password" required minlength="8" autocomplete="current-password"><div id="nicknameWrap" class="hidden"><label>暱稱（註冊後也可修改）</label><input id="signupNickname" maxlength="50"></div><button class="primary" id="authSubmit">登入</button></form><div class="actions"><button id="forgot">忘記密碼</button></div></section>
<section id="member" class="hidden"><p id="hello"></p><p class="note" id="memberEmail"></p><form id="profileForm"><label>暱稱</label><input id="nickname" required maxlength="50"><label>Discord 帳號（選填）</label><input id="discord" maxlength="100" placeholder="你的 Discord 使用者名稱"><label>人工交付方式</label><select id="delivery"><option value="email">電子郵件</option><option value="discord">Discord</option></select><p class="note">選擇 Discord 交付時，請填寫 Discord 帳號。實際交付仍需由店主核對訂單及付款。</p><button class="primary" id="saveProfile">儲存個人資料</button></form><div class="actions"><button id="logout">登出</button><button id="resetPassword">寄送重設密碼信</button></div></section>
<p id="message" class="message" role="status" aria-live="polite"></p></main>
<script type="module">
import {createClient} from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
const SUPABASE_URL = 'https://rhkoprfkyqquzgagtlgi.supabase.co';
const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_0HBJqJjOSDj9-Gyhbc43iQ_c2fEuIYK';
const $=id=>document.getElementById(id);let client=null,mode='login';
function message(text,error=false){$('message').textContent=text;$('message').className='message '+(error?'error':'success')}
function show(name){for(const id of ['auth','member'])$(id).classList.toggle('hidden',id!==name);message('')}
function busy(id,flag){$(id).disabled=flag}
function tab(next){mode=next;$('loginTab').classList.toggle('active',next==='login');$('registerTab').classList.toggle('active',next==='register');$('nicknameWrap').classList.toggle('hidden',next!=='register');$('authSubmit').textContent=next==='login'?'登入':'建立帳號';$('password').autocomplete=next==='login'?'current-password':'new-password';message('')}
async function initialize(url,key){client=createClient(url,key,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});client.auth.onAuthStateChange((_event,session)=>{setTimeout(()=>refresh(session),0)});const {data,error}=await client.auth.getSession();if(error)throw error;await refresh(data.session)}
async function refresh(session){if(!client)return;if(!session){show('auth');return}show('member');$('memberEmail').textContent='登入信箱：'+(session.user.email||'');try{const {data,error}=await client.from('profiles').select('nickname,discord_id,delivery_method').eq('id',session.user.id).single();if(error)throw error;$('nickname').value=data.nickname||'';$('discord').value=data.discord_id||'';$('delivery').value=data.delivery_method||'email';$('hello').textContent='歡迎回來，'+(data.nickname||'會員')+'！'}catch(e){message('讀取個人資料失敗：'+e.message,true)}}
$('loginTab').onclick=()=>tab('login');$('registerTab').onclick=()=>tab('register');
$('authForm').onsubmit=async e=>{e.preventDefault();busy('authSubmit',true);try{const email=$('email').value.trim(),password=$('password').value;let result;if(mode==='register'){if(!$('signupNickname').value.trim())throw Error('請填寫暱稱。');result=await client.auth.signUp({email,password,options:{emailRedirectTo:location.origin+location.pathname,data:{nickname:$('signupNickname').value.trim()}}})}else result=await client.auth.signInWithPassword({email,password});if(result.error)throw result.error;if(mode==='register'){message('註冊請求已送出。請檢查驗證信；驗證完成後再登入。');}else{await refresh(result.data.session)}}catch(e){message(e.message,true)}finally{busy('authSubmit',false)}};
$('profileForm').onsubmit=async e=>{e.preventDefault();const nickname=$('nickname').value.trim(),discord=$('discord').value.trim(),delivery=$('delivery').value;if(!nickname){message('請填寫暱稱。',true);return}if(delivery==='discord'&&!discord){message('選擇 Discord 交付時，請填寫 Discord 帳號。',true);return}busy('saveProfile',true);try{const {data:{user},error:authError}=await client.auth.getUser();if(authError||!user)throw authError||Error('請重新登入');const {error}=await client.from('profiles').update({nickname,discord_id:discord||null,delivery_method:delivery}).eq('id',user.id);if(error)throw error;$('hello').textContent='歡迎回來，'+nickname+'！';message('個人資料已儲存。')}catch(e){message('儲存失敗：'+e.message,true)}finally{busy('saveProfile',false)}};
async function sendReset(){const email=$('email').value.trim()||$('memberEmail').textContent.replace('登入信箱：','').trim();if(!email){message('請先填寫電子郵件。',true);return}try{const {error}=await client.auth.resetPasswordForEmail(email,{redirectTo:location.origin+location.pathname});if(error)throw error;message('若帳號符合寄信條件，將收到重設密碼郵件。重設密碼頁面尚待下一階段完成。')}catch(e){message(e.message,true)}}
$('forgot').onclick=sendReset;$('resetPassword').onclick=sendReset;$('logout').onclick=async()=>{const {error}=await client.auth.signOut();if(error)message(error.message,true)};

if (SUPABASE_PUBLISHABLE_KEY === 'PASTE_YOUR_SB_PUBLISHABLE_KEY_HERE') {
  show('auth');
  $('authForm').querySelectorAll('input,button').forEach(el=>el.disabled=true);
  message('網站管理員尚未設定 Supabase Publishable key，請先在 index.html 中填入公開金鑰。',true);
} else {
  initialize(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY).catch(e=>message('會員系統連線失敗：'+e.message,true));
}
</script></body></html>
